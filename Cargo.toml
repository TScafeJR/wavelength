[package]
name = "wavelength"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A from-scratch browser engine in Rust that measures itself against Chrome, pixel by pixel."
readme = "README.md"
keywords = ["browser", "engine", "html", "css", "layout"]
categories = ["web-programming", "rendering"]

# Versions are pinned exactly and the dependency list is kept short on purpose.
# The engine itself uses none; `png` only reads and writes image files.
[dependencies]
png = "=0.18.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
